<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Weekly Pick 'Em</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f293d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 10px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
    }

    header {
      margin-bottom: 8px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #38bdf8, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .controls-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #090d16;
      color: #fff;
      font-size: 0.8rem;
    }

    .playerNameInput { flex: 1; }
    .apiKeyInput { flex: 1.5; }

    button.btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.8rem;
    }

    button.btn:hover { background: var(--accent-hover); }

    .secondary-btn {
      background: #1f293d;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .secondary-btn:hover { background: #334155; }

    .danger-btn {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .danger-btn:hover { background: rgba(239, 68, 68, 0.1); }

    .week-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .week-bar h2 {
      font-size: 0.9rem;
      font-weight: 700;
      color: #38bdf8;
    }

    /* MARKET TOGGLE SWITCH */
    .market-toggle {
      display: flex;
      background: #090d16;
      padding: 2px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .toggle-opt {
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .toggle-opt.active {
      background: #1f293d;
      color: #38bdf8;
    }

    /* 3-COLUMN COMPACT SCREENSHOT GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    @media (max-width: 1100px) {
      .games-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 650px) {
      .games-grid { grid-template-columns: 1fr; }
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .teams-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .team-btn {
      background: #090d16;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 4px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
    }

    .team-btn:hover { border-color: #64748b; }

    .team-btn.selected {
      border-color: var(--accent);
      background: rgba(34, 197, 94, 0.18);
    }

    /* LARGER LOGOS */
    .team-logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
    }

    .team-name {
      font-weight: 700;
      font-size: 0.75rem;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .odds-container {
      display: flex;
      gap: 3px;
      align-items: center;
      font-size: 0.72rem;
    }

    .odds-point {
      color: var(--text-muted);
      font-weight: 600;
    }

    .odds-price {
      color: #38bdf8;
      font-size: 0.68rem;
    }

    .team-btn.selected .odds-point,
    .team-btn.selected .odds-price {
      color: var(--accent);
      font-weight: 700;
    }

    .status-msg {
      text-align: center;
      padding: 20px 0;
      color: var(--text-muted);
      grid-column: span 3;
      font-size: 0.85rem;
    }

    /* SCREENSHOT MODE STYLING */
    body.screenshot-mode .controls-box,
    body.screenshot-mode .week-nav-btn {
      display: none !important;
    }
    body.screenshot-mode header p.subtitle {
      display: none;
    }
    body.screenshot-mode {
      background: #050b14;
      padding: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="mainTitle">NFL Pick 'Em</h1>
    <p class="subtitle">Select your picks against the spread or moneyline.</p>
  </header>

  <div class="controls-box" id="controlsBox">
    <input type="text" id="playerNameInput" class="playerNameInput" placeholder="Your Name (e.g. Owen)..." oninput="saveName()" />
    <input type="text" id="apiKeyInput" class="apiKeyInput" placeholder="Paste Odds API key here..." />
    <button class="btn" onclick="fetchGames()">Load Data</button>
    <button class="secondary-btn" onclick="toggleScreenshotMode()">📸 Screenshot Mode</button>
    <button class="secondary-btn danger-btn" onclick="clearPicks()">Reset</button>
  </div>

  <div class="week-bar">
    <button class="secondary-btn week-nav-btn" style="max-width: 80px;" onclick="changeWeek(-1)">← Prev</button>
    <h2 id="weekLabel">Current Week</h2>
    
    <div class="market-toggle">
      <div class="toggle-opt active" id="toggleSpread" onclick="setMarket('spreads')">Spreads</div>
      <div class="toggle-opt" id="toggleH2H" onclick="setMarket('h2h')">Moneyline</div>
    </div>

    <button class="secondary-btn week-nav-btn" style="max-width: 80px;" onclick="changeWeek(1)">Next →</button>
  </div>

  <div id="content" class="games-grid">
    <div class="status-msg">Enter your API key above to load games & odds.</div>
  </div>
</div>

<script>
  const LOGO_MAP = {
    'Arizona Cardinals': 'ari', 'Atlanta Falcons': 'atl', 'Baltimore Ravens': 'bal',
    'Buffalo Bills': 'buf', 'Carolina Panthers': 'car', 'Chicago Bears': 'chi',
    'Cincinnati Bengals': 'cin', 'Cleveland Browns': 'cle', 'Dallas Cowboys': 'dal',
    'Denver Broncos': 'den', 'Detroit Lions': 'det', 'Green Bay Packers': 'gb',
    'Houston Texans': 'hou', 'Indianapolis Colts': 'ind', 'Jacksonville Jaguars': 'jax',
    'Kansas City Chiefs': 'kc', 'Las Vegas Raiders': 'lv', 'Los Angeles Chargers': 'lac',
    'Los Angeles Rams': 'lar', 'Miami Dolphins': 'mia', 'Minnesota Vikings': 'min',
    'New England Patriots': 'ne', 'New Orleans Saints': 'no', 'New York Giants': 'nyg',
    'New York Jets': 'nyj', 'Philadelphia Eagles': 'phi', 'Pittsburgh Steelers': 'pit',
    'San Francisco 49ers': 'sf', 'Seattle Seahawks': 'sea', 'Tampa Bay Buccaneers': 'tb',
    'Tennessee Titans': 'ten', 'Washington Commanders': 'was'
  };

  let allGames = [];
  let picks = JSON.parse(localStorage.getItem('nfl_picks') || '{}');
  let savedApiKey = localStorage.getItem('odds_api_key') || '';
  let savedName = localStorage.getItem('nfl_player_name') || '';
  let currentMarket = 'spreads'; // 'spreads' or 'h2h'
  let currentWeekOffset = 0;
  let isScreenshotMode = false;

  if (savedName) {
    document.getElementById('playerNameInput').value = savedName;
    updateTitle(savedName);
  }

  if (savedApiKey) {
    document.getElementById('apiKeyInput').value = savedApiKey;
    fetchGames();
  }

  function getLogoUrl(teamName) {
    const code = LOGO_MAP[teamName];
    if (code) return `https://a.espncdn.com/i/teamlogos/nfl/500/${code}.png`;
    return 'https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png';
  }

  function saveName() {
    const name = document.getElementById('playerNameInput').value.trim();
    localStorage.setItem('nfl_player_name', name);
    updateTitle(name);
  }

  function updateTitle(name) {
    const titleEl = document.getElementById('mainTitle');
    titleEl.innerText = name ? `${name}'s NFL Picks` : `NFL Pick 'Em`;
  }

  function setMarket(market) {
    currentMarket = market;
    document.getElementById('toggleSpread').classList.toggle('active', market === 'spreads');
    document.getElementById('toggleH2H').classList.toggle('active', market === 'h2h');
    renderCurrentWeek();
  }

  async function fetchGames() {
    const apiKey = document.getElementById('apiKeyInput').value.trim();
    const content = document.getElementById('content');

    if (!apiKey) {
      alert('Please enter a free API key from the-odds-api.com');
      return;
    }

    localStorage.setItem('odds_api_key', apiKey);
    content.innerHTML = '<div class="status-msg">Loading games, spreads & moneylines...</div>';

    try {
      // Pull both spreads and moneyline (h2h) in a single request
      const response = await fetch(`https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds/?apiKey=${apiKey}&regions=us&markets=spreads,h2h&oddsFormat=american`);
      
      if (!response.ok) throw new Error('API key invalid or limit reached.');

      allGames = await response.json();

      if (allGames.length === 0) {
        content.innerHTML = '<div class="status-msg">No upcoming NFL games found right now.</div>';
        return;
      }

      renderCurrentWeek();
    } catch (err) {
      content.innerHTML = `<div class="status-msg" style="color:#ef4444;">Error: ${err.message}</div>`;
    }
  }

  function renderCurrentWeek() {
    if (!allGames.length) return;

    const sortedGames = [...allGames].sort((a, b) => new Date(a.commence_time) - new Date(b.commence_time));
    const firstGameDate = new Date(sortedGames[0].commence_time);
    
    const weekStart = new Date(firstGameDate);
    weekStart.setDate(weekStart.getDate() + (currentWeekOffset * 7));
    
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 7);

    const weekGames = sortedGames.filter(g => {
      const gDate = new Date(g.commence_time);
      return gDate >= weekStart && gDate < weekEnd;
    });

    const gamesToRender = weekGames.length > 0 ? weekGames : sortedGames;

    document.getElementById('weekLabel').innerText = `Games (${weekStart.toLocaleDateString([], {month:'short', day:'numeric'})} - ${weekEnd.toLocaleDateString([], {month:'short', day:'numeric'})})`;

    renderGrid(gamesToRender);
  }

  function renderGrid(games) {
    const content = document.getElementById('content');
    let html = '';

    games.forEach(game => {
      const bookmaker = game.bookmakers[0];
      let homeDisplay = { point: '', price: 'N/A' };
      let awayDisplay = { point: '', price: 'N/A' };

      if (bookmaker) {
        const marketObj = bookmaker.markets.find(m => m.key === currentMarket);

        if (marketObj) {
          const homeOutcome = marketObj.outcomes.find(o => o.name === game.home_team);
          const awayOutcome = marketObj.outcomes.find(o => o.name === game.away_team);

          if (currentMarket === 'spreads') {
            if (homeOutcome) {
              homeDisplay.point = formatSpread(homeOutcome.point);
              homeDisplay.price = formatPrice(homeOutcome.price);
            }
            if (awayOutcome) {
              awayDisplay.point = formatSpread(awayOutcome.point);
              awayDisplay.price = formatPrice(awayOutcome.price);
            }
          } else if (currentMarket === 'h2h') {
            if (homeOutcome) homeDisplay.price = formatPrice(homeOutcome.price);
            if (awayOutcome) awayDisplay.price = formatPrice(awayOutcome.price);
          }
        }
      }

      const dateStr = new Date(game.commence_time).toLocaleString([], {
        weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      // Key picks by game ID and market type so spread and moneyline picks stay distinct
      const pickKey = `${game.id}_${currentMarket}`;
      const selectedPick = picks[pickKey];

      html += `
        <div class="game-card">
          <div class="game-header">
            <span>${dateStr}</span>
            <span>${currentMarket === 'spreads' ? 'Spread' : 'Moneyline'}</span>
          </div>
          <div class="teams-container">
            <button class="team-btn ${selectedPick === game.away_team ? 'selected' : ''}" 
                    onclick="makePick('${game.id}', '${escapeQuotes(game.away_team)}')">
              <img src="${getLogoUrl(game.away_team)}" class="team-logo" alt="${game.away_team}" />
              <span class="team-name">${game.away_team}</span>
              <div class="odds-container">
                ${homeDisplay.point ? `<span class="odds-point">${awayDisplay.point}</span>` : ''}
                <span class="odds-price">${awayDisplay.price}</span>
              </div>
            </button>
            
            <button class="team-btn ${selectedPick === game.home_team ? 'selected' : ''}" 
                    onclick="makePick('${game.id}', '${escapeQuotes(game.home_team)}')">
              <img src="${getLogoUrl(game.home_team)}" class="team-logo" alt="${game.home_team}" />
              <span class="team-name">${game.home_team}</span>
              <div class="odds-container">
                ${homeDisplay.point ? `<span class="odds-point">${homeDisplay.point}</span>` : ''}
                <span class="odds-price">${homeDisplay.price}</span>
              </div>
            </button>
          </div>
        </div>
      `;
    });

    content.innerHTML = html;
  }

  function changeWeek(direction) {
    currentWeekOffset += direction;
    renderCurrentWeek();
  }

  function formatSpread(point) {
    if (point > 0) return `+${point}`;
    return `${point}`;
  }

  function formatPrice(price) {
    if (!price) return '';
    if (price > 0) return `+${price}`;
    return `${price}`;
  }

  function escapeQuotes(str) {
    return str.replace(/'/g, "\\'");
  }

  function makePick(gameId, teamName) {
    const pickKey = `${gameId}_${currentMarket}`;
    if (picks[pickKey] === teamName) {
      delete picks[pickKey];
    } else {
      picks[pickKey] = teamName;
    }
    
    localStorage.setItem('nfl_picks', JSON.stringify(picks));
    renderCurrentWeek();
  }

  function toggleScreenshotMode() {
    isScreenshotMode = !isScreenshotMode;
    document.body.classList.toggle('screenshot-mode', isScreenshotMode);
  }

  function clearPicks() {
    if (confirm('Clear all your current picks?')) {
      picks = {};
      localStorage.removeItem('nfl_picks');
      renderCurrentWeek();
    }
  }
</script>
</body>
</html>
